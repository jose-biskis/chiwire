<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contimiti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-archetype="internal" data-theme="light">
    <div id="root"></div>
    <script>
      try {
        var archetype = "internal";
        var colorMode = "light";
        var raw = localStorage.getItem("contimiti-appearance");
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed.archetype === "internal" || parsed.archetype === "valenstonic") {
            archetype = parsed.archetype;
          }
          if (parsed.colorMode === "light" || parsed.colorMode === "dark") {
            colorMode = parsed.colorMode;
          }
        } else {
          var legacy = localStorage.getItem("contimiti-color-mode");
          if (legacy === "light" || legacy === "dark") {
            colorMode = legacy;
          }
        }
        document.documentElement.dataset.archetype = archetype;
        document.documentElement.dataset.theme = colorMode;
        document.body.dataset.archetype = archetype;
        document.body.dataset.theme = colorMode;
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
